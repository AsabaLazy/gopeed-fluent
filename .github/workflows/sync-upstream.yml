name: Sync Upstream & Build

on:
  schedule:
    # 每天北京时间 02:00, 14:00 (UTC 18:00, 06:00) 自动检测上游更新
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and sync upstream commits
        id: sync_code
        run: |
          git remote add upstream https://github.com/GopeedLab/gopeed.git
          git fetch upstream main --tags --force

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up-to-date with upstream main."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging upstream/main into main while preserving the Fluent UI..."
          git merge --no-commit --no-ff upstream/main || true
          git rev-parse -q --verify MERGE_HEAD >/dev/null

          # Upstream 2.x replaced the Flutter app. Keep this fork's UI and CI,
          # and merge only the core/backend changes.
          git rm -r -q --force ui
          git checkout HEAD -- ui
          git rm -r -q --force --ignore-unmatch ui/flutter_old
          git rm -r -q --force .github/workflows
          git checkout HEAD -- .github/workflows
          git rm -q --force --ignore-unmatch .github/workflows/release.yml .github/workflows/test.yml

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts outside the preserved UI:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit --allow-empty -m "chore: sync upstream GopeedLab/gopeed"
          git push origin main
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: Check for new upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh release view --repo GopeedLab/gopeed --json tagName -q .tagName 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No upstream releases found."
            exit 0
          fi
          echo "Latest upstream release tag: $UPSTREAM_TAG"

          if gh release view "$UPSTREAM_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $UPSTREAM_TAG already exists in ${{ github.repository }}."
            exit 0
          fi

          echo "New release detected! Triggering build workflow for $UPSTREAM_TAG..."
          VERSION="${UPSTREAM_TAG#v}"
          gh workflow run build.yml --repo "${{ github.repository }}" -f version="$VERSION" -f publish_release=true
