name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.9.3)"
        required: false
        default: "1.9.3"
        type: string
      publish_release:
        description: "Publish to GitHub Releases"
        required: false
        default: true
        type: boolean

env:
  GO_VERSION: "1.24"
  FLUTTER_CHANNEL: "stable"

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/}"
            V="${V#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$V" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [resolve-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: windows-11-arm
            llvm_ver: "20251202"
            flutter_channel: "master"
            flutter_version: "7e1c8868"
          - arch: x64
            os: windows-2022
            llvm_ver: ""
            flutter_channel: "stable"
            flutter_version: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths
        run: |
          git config --global core.longpaths true

      - name: Install llvm-mingw-ucrt-aarch64 (ARM64 only)
        if: matrix.arch == 'arm64'
        run: |
          $ver = "${{ matrix.llvm_ver }}"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          $zip = "$env:RUNNER_TEMP\\llvm.zip"
          $extract = "$env:RUNNER_TEMP\\extract"
          $target = "C:\\clangarm64"
          curl -L $url -o $zip
          rm -r -fo $extract,$target -ea Ignore
          mkdir $extract | Out-Null
          tar -xf $zip -C $extract
          mv (Get-ChildItem $extract)[0].FullName $target
          $b = "$target\\bin"
          "CC=$b\\clang.exe"        >> $env:GITHUB_ENV
          "CXX=$b\\clang++.exe"     >> $env:GITHUB_ENV
          "CLANGARM64_BIN=$b"       >> $env:GITHUB_ENV
          "CGO_ENABLED=1"           >> $env:GITHUB_ENV
          "CLANGARM64_ROOT=$target" >> $env:GITHUB_ENV
          $b >> $env:GITHUB_PATH

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ matrix.flutter_version }}

      - name: Build Windows
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GOARCH: ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
        run: |
          cp .github\workflows\scripts\ChineseSimplified.isl "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force

          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=$env:VERSION" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater

          cd ui/flutter
          flutter build windows --release

          $release = "build\windows\${{ matrix.arch }}\runner\Release\"
          $system = "C:\Windows\System32"

          if ("${{ matrix.arch }}" -eq "arm64") {
              $mingw = "$env:CLANGARM64_ROOT\aarch64-w64-mingw32\bin"
              cp $mingw\libc++.dll $release
              cp $mingw\libunwind.dll $release
          } else {
              $mingw = "C:\Program Files\Git\mingw64\bin"
              cp $mingw\libstdc++-6.dll $release
              cp $mingw\libgcc_s_seh-1.dll $release
          }

          cp $mingw\libwinpthread-1.dll $release
          cp $system\msvcp140.dll $release
          cp $system\vcruntime140.dll $release
          cp $system\vcruntime140_1.dll $release

          mkdir build\windows\Output -ea 0
          Compress-Archive -Path "$release\*" -DestinationPath "build\windows\Output\Gopeed_Fluent_${env:VERSION}_windows_${{ matrix.arch }}_portable.zip"

          cp ..\..\.github\workflows\scripts\setup.iss build\windows\setup.iss
          cd build\windows
          iscc.exe /DMyAppVersion="$env:VERSION" /DArchitectures="${{ matrix.arch }}" setup.iss

          $dest = "Output\Gopeed_Fluent_$($env:VERSION)_windows_${{ matrix.arch }}.exe"
          mv "Output\gopeed.exe" $dest

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: ui/flutter/build/windows/Output/*

  build-linux:
    needs: [resolve-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libfuse2 liblzma-dev

      - name: Build Linux binaries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p ui/flutter/linux/bundle/lib ui/flutter/assets/exec
          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=$VERSION" -buildmode=c-shared -o ui/flutter/linux/bundle/lib/libgopeed.so github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater github.com/GopeedLab/gopeed/cmd/updater

          cd ui/flutter
          flutter build linux --release

          mkdir -p dist

          # 1. Package .tar.gz
          tar -czvf "dist/Gopeed_Fluent_${VERSION}_linux_amd64.tar.gz" -C build/linux/x64/release/bundle .

          # 2. Package .deb
          PKG_DIR="deb_pkg"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/opt/gopeed" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/scalable/apps" "$PKG_DIR/DEBIAN"
          cp -r build/linux/x64/release/bundle/* "$PKG_DIR/opt/gopeed/"
          ln -sf /opt/gopeed/gopeed "$PKG_DIR/usr/bin/gopeed-fluent"
          ln -sf /opt/gopeed/gopeed "$PKG_DIR/usr/bin/gopeed"
          cp assets/icon/icon.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/gopeed-fluent.svg"
          cp assets/icon/icon.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/gopeed.svg"

          cat << 'EOF' > "$PKG_DIR/usr/share/applications/gopeed-fluent.desktop"
          [Desktop Entry]
          Name=Gopeed Fluent
          Comment=High speed downloader with Fluent UI
          Exec=/opt/gopeed/gopeed %U
          Icon=gopeed-fluent
          Terminal=false
          Type=Application
          Categories=Network;Utility;
          MimeType=x-scheme-handler/gopeed;x-scheme-handler/magnet;application/x-bittorrent;
          EOF
          sed -i 's/^[ \t]*//' "$PKG_DIR/usr/share/applications/gopeed-fluent.desktop"

          cat << EOF > "$PKG_DIR/DEBIAN/control"
          Package: gopeed-fluent
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libayatana-appindicator3-1, libkeybinder-3.0-0
          Maintainer: AsabaLazy <https://github.com/AsabaLazy/gopeed-fluent>
          Description: High speed downloader with Fluent UI
          EOF
          sed -i 's/^[ \t]*//' "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/Gopeed_Fluent_${VERSION}_linux_amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: ui/flutter/dist/*

  build-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Build macOS app
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p ui/flutter/macos/Frameworks ui/flutter/assets/exec
          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=$VERSION" -buildmode=c-shared -o ui/flutter/macos/Frameworks/libgopeed.dylib github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater github.com/GopeedLab/gopeed/cmd/updater

          cd ui/flutter
          flutter config --no-enable-swift-package-manager
          flutter build macos --release

          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y "../../../../../dist/Gopeed_Fluent_${VERSION}_macos.zip" Gopeed.app
          hdiutil create -volname "Gopeed Fluent" -srcfolder Gopeed.app -ov -format UDZO "../../../../../dist/Gopeed_Fluent_${VERSION}_macos.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ui/flutter/dist/*

  release:
    needs: [resolve-version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          name: ${{ needs.resolve-version.outputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
